name: test

on:
  # Every PR, so a stacked PR is tested before its base merges.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install PyYAML and the Claude Code CLI
        run: |
          pip install pyyaml
          npm install -g @anthropic-ai/claude-code@2.1.289
      - name: Run tests
        run: bash tests/run.sh
